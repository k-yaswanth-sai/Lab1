<html>
<head>

<style>
#dispaly{
width:320px;
height:60px;
border:2px solid black;
border-radius:8px;
padding:8px;
background-color:grey;
color:grey;
}
.container{
display:flex;
flex-direction:row;
justify-content:center;
}
.cal{

display:grid;
align:center;
margin:40px;
border-radius:20px;
border:2px solid black;
background-color:lightblue;
justify-content:center;
width:360;
}
.cal input{
width:320px;
border:2px solid black;
border-radius:8px;
height:60px;
}
.cal button{
height:60px;
width:80px;

}

.operator{
font-size:18px;
color:orange;
}
</style>
</head>
<body bgcolor="white">
<div class="container">
<div class="cal">
<br/>
<br/>

<div  class="section1">
<input type="text" id="display" value="0" >
<br/>
<br/>
<button type="submit" onclick="clearDisplay()" class="clear" >C</button>
<button type="submit" onclick="remove()" >back</button>


<button type="submit" onclick="appendValue('%')" color="black" class="operator">%</button>

<button type="submit" onclick="appendValue('/')" class="operator">/</button>

</div>

<div class="section2">
<button type="submit" onclick="appendValue('7')" >7</button>
<button type="submit" onclick="appendValue('8')" >8</button>

<button type="submit" onclick="appendValue(9)" >9</button>

<button type="submit" onclick="appendValue('*')" class="operator">*</button>
</div>

<div class="section3">
<button type="submit" onclick="appendValue('4')" >4</button>
<button type="submit" onclick="appendValue('5')" >5</button>


<button type="submit" onclick="appendValue('6')" >6</button>

<button type="submit" onclick="appendValue('+')" class="operator">+</button>
</div>
<div class="section4">

<button type="submit" onclick="appendValue('1')" >1</button>
<button type="submit" onclick="appendValue('2')" >2</button>


<button type="submit" onclick="appendValue('3')" >3</button>

<button type="submit" onclick="appendValue('-')" class="operator">-</button>
</div>
<div class="section4">
<button type="submit" onclick="appendValue('0')" >0</button>
<button type="submit" onclick="appendValue('.')" >.</button>
<button type="submit" onclick="calculateValue()" class="calculate">=</button>






</div>
</div>
</div>
<script>
const display=document.getElementById('display');
function clearDisplay(){
display.value=0;
}
function remove(){
if(display.value.length==1){
display.value=0;
}
else{
display.value=display.value.slice(0,-1);

}
}
function appendValue(value){
if(display.value=="0"){
display.value=value;

}
else{
display.value=display.value+value;
}
}
function calculateValue(){
try{
display.value=eval(display.value);
}


catch{
display.value="not valid";
}
}

</script>
</body>
</html>
