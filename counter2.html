<html>
<head>

<title>COUNTER</title>
<style>
.counter{
display:flex;
flex-direction:row;
justify-content:center;

}
.section1{
display:grid;
grid-template-rows:60% 25% 15%;
border-radius:15px;
border:2px solid black;
justify-content:center;
background-color:lightblue;
width:340;
height:280;
}
.section2{
grid-row:1/2;

align-items:center;
justify-content:center;
font-size:40px;
margin:80px;
color:blue;

}

.section3{
display:flex;

grid-row:2/3;
justify-content:center;
width:180px;
gap:20px;
align-items:center;

flex-direction:row;
}
.section3 button{
width:80px;
height:40px;
}

</style>

</head>
<body>

<h2 align="center">COUNTER</h2>
<div class="counter">
<div class="section1">


<div class="section2">





<p id="value"></p>
</div>
<div class="section3">

<button onclick="add()" style="background-color:green; color:black;">+</button>

<button onclick="sub()" style="background-color:orange; color:black;">-</button>
<button onclick="set()" style="background-color:blue; color:"white"">RESET</button>
</div>
</div>
</div>



<script>
var m=15;
document.getElementById('value').innerHTML=m;
function add(){
m++;
document.getElementById('value').innerHTML=m;
}
function sub(){
m--;
document.getElementById('value').innerHTML=m;
}





function set(){
m=15;
document.getElementById('value').innerHTML=m;
}


</script>
</body>
</html>
